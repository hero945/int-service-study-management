<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>临床研发管线管理系统 · 页面截图</title>
  <style>
    :root{--brand:#1e5ed6;--canvas:#f5f6f8;--surface:#fff;--border:#e7e9ed;--text:#1a1d23;--secondary:#5b6472;--muted:#8a929e;--blue-bg:#e8f0fe;--blue:#1d5fd1;--green-bg:#e5f4eb;--green:#177245;--orange-bg:#fff0dc;--orange:#a85e0c;--red-bg:#fce7e6;--red:#bf3630;--gray-bg:#eef1f4;--gray:#596273}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"IBM Plex Sans","PingFang SC","Microsoft YaHei",Arial,sans-serif;background:var(--canvas);color:var(--text);font-size:12px}.app{display:grid;grid-template-columns:216px 1fr;width:1440px;height:900px;background:var(--canvas)}
    aside{background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column}.brand{height:56px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--border)}.logo{width:30px;height:30px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700}.brand b{font-size:13px}.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:.6px;margin-top:2px}.nav{padding:12px 8px;display:flex;flex-direction:column;gap:3px}.nav a{height:36px;border-radius:7px;display:flex;align-items:center;gap:10px;padding:0 11px;color:#4d5562;text-decoration:none;font-size:12px}.nav a span{width:17px;text-align:center;color:#87909c}.nav a.active{background:var(--blue-bg);color:var(--blue);font-weight:600}.nav a.active span{color:var(--blue)}.aside-foot{margin-top:auto;padding:12px 14px;border-top:1px solid var(--border);display:flex;align-items:center;gap:9px}.avatar{width:30px;height:30px;border-radius:50%;background:#dce7fb;color:#2459a9;display:grid;place-items:center;font-weight:600}.user{line-height:1.45}.user small{display:block;color:var(--muted)}
    .workspace{min-width:0;display:flex;flex-direction:column}.topbar{height:56px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 22px}.title{font-size:15px;font-weight:600}.subtitle{font-size:10.5px;color:var(--muted);margin-left:12px}.search{margin-left:auto;width:242px;height:32px;border:1px solid #dfe3e8;border-radius:8px;background:#fafbfc;color:#9299a4;display:flex;align-items:center;padding:0 11px}.top-avatar{width:28px;height:28px;margin-left:12px;border-radius:50%;background:#273142;color:#fff;display:grid;place-items:center;font-size:10px}.content{height:844px;padding:18px 22px 20px;overflow:hidden}.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:12px}.control{height:32px;min-width:128px;border:1px solid #dfe3e8;border-radius:7px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 10px;color:#4f5866}.control.wide{min-width:220px}.btn{height:32px;border-radius:7px;border:1px solid #dfe3e8;background:#fff;padding:0 13px;color:#48515f;font-weight:500}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.spacer{flex:1}.hint{color:var(--muted);font-size:11px}.chips{display:flex;gap:6px}.chip,.status{display:inline-flex;align-items:center;border-radius:6px;padding:3px 8px;font-size:10.5px;font-weight:600;white-space:nowrap}.blue{background:var(--blue-bg);color:var(--blue)}.green{background:var(--green-bg);color:var(--green)}.orange{background:var(--orange-bg);color:var(--orange)}.red{background:var(--red-bg);color:var(--red)}.gray{background:var(--gray-bg);color:var(--gray)}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}.stat{background:#fff;border:1px solid var(--border);border-radius:9px;padding:13px 15px}.stat .label{color:var(--muted);font-size:10.5px}.stat .value{font:600 22px/1.25 "IBM Plex Mono",monospace;margin-top:5px}.stat .note{color:var(--secondary);font-size:10px;margin-top:3px}.panel{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden}.panel-head{height:45px;padding:0 14px;display:flex;align-items:center;border-bottom:1px solid var(--border)}.panel-head h2{font-size:12.5px;margin:0}.panel-head small{color:var(--muted);margin-left:9px}.panel-head .right{margin-left:auto;color:var(--muted)}table{width:100%;border-collapse:collapse;table-layout:fixed}th{height:38px;padding:0 10px;text-align:left;background:#fbfcfd;color:#7d8693;font-size:10px;font-weight:600;border-bottom:1px solid var(--border)}td{height:43px;padding:0 10px;border-bottom:1px solid #eef0f3;color:#343b46;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}tbody tr:last-child td{border-bottom:0}.mono{font-family:"IBM Plex Mono",monospace}.strong{font-weight:600}.ta{display:flex;align-items:center;gap:6px}.dot{width:6px;height:6px;border-radius:50%;background:#c06514}.dot.auto{background:#7a5ad6}.dot.meta{background:#1e5ed6}.link{color:var(--blue);font-weight:500}.muted{color:var(--muted)}
    .stage-panel{overflow:hidden}.stage-table th,.stage-table td{font-size:9.5px}.stage-table th:nth-child(n+6),.stage-table td:nth-child(n+6){text-align:center}.stage-table .cell{display:inline-flex;min-width:62px;justify-content:center;border-radius:5px;padding:5px 4px;font-size:9px;font-weight:600}.section-line{display:flex;align-items:center;margin:2px 0 9px}.section-line h2{font-size:12.5px;margin:0}.section-line span{margin-left:8px;color:var(--muted)}
    .monthly-grid{display:grid;grid-template-columns:1.45fr .55fr;gap:12px}.side-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:15px}.progress{height:7px;border-radius:5px;background:#edf0f3;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;background:var(--brand);border-radius:5px}.line-item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #edf0f3}.line-item:last-child{border:0}.risk-score{font:600 13px "IBM Plex Mono",monospace}.matrix th:first-child,.matrix td:first-child{width:170px;position:sticky;left:0;background:#fff}.matrix th:not(:first-child),.matrix td:not(:first-child){text-align:center}.person{background:#f0f4fb;color:#365f9e;border-radius:5px;padding:4px 6px;font-size:9.5px}.report-layout{display:grid;grid-template-columns:330px 1fr;gap:12px;height:738px}.report-controls{background:#fff;border:1px solid var(--border);border-radius:10px;padding:18px}.report-preview{background:#fff;border:1px solid var(--border);border-radius:10px;padding:24px 28px;overflow:hidden}.report-preview h1{font-size:20px;margin:0 0 4px}.report-preview h3{font-size:12px;margin:18px 0 8px}.field{margin-bottom:14px}.field label{display:block;color:var(--muted);font-size:10.5px;margin-bottom:6px}.field .control{width:100%}.permission{display:flex;gap:5px;flex-wrap:wrap}.milestone-meta{display:flex;gap:30px;padding:14px 16px;background:#fff;border:1px solid var(--border);border-radius:9px;margin-bottom:12px}.milestone-meta b{display:block;margin-top:3px}.milestone-meta span{color:var(--muted);font-size:10px}.phase-row{background:#f7f9fc;color:#2e5da3;font-weight:600}.shot-note{position:fixed;right:12px;bottom:8px;color:#a0a7b1;font:9px "IBM Plex Mono",monospace}
  </style>
</head>
<body><div id="root"></div><div class="shot-note">HTML SNAPSHOT · 1440×900</div>
<script>
const pages={pipeline:['管线总览 · Coverpage','研发管线阶段门 · 一屏可见'],study:['研究 Study 列表','全部 Study 明细 · 可搜索排序'],monthly:['研究月度汇报','按 Study 逐月填写与查看'],risk:['风险管理','全局风险登记册 · Risk Register'],team:['团队矩阵','Study × 项目角色分工'],config:['管线配置','Program / Project / Study 基础数据'],report:['月报导出','生成与下载月度报告'],accounts:['账号管理','用户、角色与权限'],milestone:['里程碑','Study 里程碑计划与实际进度']};
const nav=[['pipeline','▦','管线总览'],['study','▤','研究 Study 列表'],['monthly','✎','研究月度汇报'],['risk','⚠','风险管理'],['team','◫','团队矩阵'],['config','⚙','管线配置'],['report','⇩','月报导出'],['accounts','⚷','账号管理']];
const studies=[
['Oncology','HDM1005','HDM1005-1','HDM1005-302','非小细胞肺癌','Phase 2','进行中','张伟'],['Autoimmune','HDM2015','HDM2015-2','HDM2015-102','系统性红斑狼疮','IND','准备中','李静'],['Metabolic','HDM2020','HDM2020-1','HDM2020-001','2型糖尿病','PreIND','进行中','王芳'],['Oncology','HDM1005','HDM1005-3','HDM1005-303','乳腺癌','Phase 3-1','延期','张伟'],['Autoimmune','HDM3022','HDM3022-1','HDM3022-201','类风湿关节炎','Phase 1','进行中','刘洋'],['Metabolic','HDM4021','HDM4021-2','HDM4021-105','肥胖症','Phase 2','已完成','王芳']];
function status(s){const c=s==='进行中'?'blue':s==='已完成'?'green':s==='延期'?'red':s==='准备中'?'gray':'orange';return `<span class="status ${c}">${s}</span>`}
function shell(page,body){const meta=pages[page];return `<main class="app"><aside><div class="brand"><div class="logo">研</div><div><b>临床研发平台</b><small>PIPELINE OPS</small></div></div><nav class="nav">${nav.map(n=>`<a class="${n[0]===page?'active':''}"><span>${n[1]}</span>${n[2]}</a>`).join('')}</nav><div class="aside-foot"><div class="avatar">陈</div><div class="user"><b>陈研发</b><small>系统管理员</small></div></div></aside><section class="workspace"><header class="topbar"><div class="title">${meta[0]}</div><div class="subtitle">${meta[1]}</div><div class="search">⌕　搜索化合物、适应症、Program</div><div class="top-avatar">陈</div></header><div class="content">${body}</div></section></main>`}
const filters=`<div class="toolbar"><div class="control wide">全部治疗领域 <span>⌄</span></div><div class="control">全部 Program <span>⌄</span></div><div class="control">全部阶段 <span>⌄</span></div><div class="control">全部状态 <span>⌄</span></div><button class="btn">重置</button><div class="spacer"></div><span class="hint">共 18 个项目 · 24 项研究</span></div>`;
function pipeline(){return filters+`<div class="section-line"><h2>研发管线阶段门</h2><span>按 Project 聚合，显示各研究当前最深阶段</span><div class="spacer"></div><div class="chips"><span class="chip blue">进行中 12</span><span class="chip orange">需关注 3</span><span class="chip green">已完成 3</span></div></div><div class="panel stage-panel"><table class="stage-table"><thead><tr><th style="width:98px">TA</th><th style="width:92px">Program</th><th style="width:112px">Project</th><th style="width:120px">产品 / MOA</th><th style="width:106px">适应症</th><th>PreIND</th><th>IND</th><th>Phase 1</th><th>Phase 2</th><th>PRE-3</th><th>Phase 3-1</th><th>Phase 3-2</th></tr></thead><tbody>${studies.map((s,i)=>`<tr><td><div class="ta"><i class="dot ${i%3===1?'auto':i%3===2?'meta':''}"></i>${s[0]}</div></td><td class="mono strong">${s[1]}</td><td class="link">${s[2]}</td><td>HDM-${100+i} / JAK</td><td>${s[4]}</td>${[0,1,2,3,4,5,6].map((p)=>`<td><span class="cell ${p<i%7?'green':p===i%7?(s[6]==='延期'?'red':'blue'):'gray'}">${p<i%7?'已完成':p===i%7?s[6]:'—'}</span></td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function study(){return filters+`<div class="stats"><div class="stat"><div class="label">研究总数</div><div class="value">24</div><div class="note">覆盖 18 个项目</div></div><div class="stat"><div class="label">进行中</div><div class="value">16</div><div class="note">66.7%</div></div><div class="stat"><div class="label">本月里程碑</div><div class="value">11</div><div class="note">已完成 8 项</div></div><div class="stat"><div class="label">开放风险</div><div class="value">7</div><div class="note">高风险 2 项</div></div></div><div class="panel"><div class="panel-head"><h2>Study 明细</h2><small>点击 Study No. 查看详情或里程碑</small></div><table><thead><tr><th>TA</th><th>Program</th><th>Project</th><th>Study No.</th><th>适应症</th><th>当前阶段</th><th>Project 状态（实时）</th><th>PL</th><th>操作</th></tr></thead><tbody>${studies.map(s=>`<tr><td>${s[0]}</td><td class="mono">${s[1]}</td><td>${s[2]}</td><td class="mono link">${s[3]}</td><td>${s[4]}</td><td><span class="chip blue">${s[5]}</span></td><td>${status(s[6])}</td><td>${s[7]}</td><td class="link">详情　里程碑</td></tr>`).join('')}</tbody></table></div>`}
function monthly(){return `<div class="toolbar"><div class="control wide">2026-07 <span>⌄</span></div><div class="control wide">全部 Study <span>⌄</span></div><div class="spacer"></div><button class="btn primary">＋ 填写月度进展</button></div><div class="stats"><div class="stat"><div class="label">应填功能线</div><div class="value">138</div></div><div class="stat"><div class="label">已填写</div><div class="value">112</div><div class="note">完成率 81.2%</div></div><div class="stat"><div class="label">待填写</div><div class="value">26</div></div><div class="stat"><div class="label">已完成 Study</div><div class="value">15</div></div></div><div class="monthly-grid"><div class="panel"><div class="panel-head"><h2>研究月度汇报</h2><small>按 Study 汇总功能线填写状态</small></div><table><thead><tr><th>TA</th><th>Program</th><th>Study No.</th><th>适应症</th><th>已填写部门</th><th>完成率</th><th>状态</th></tr></thead><tbody>${studies.map((s,i)=>`<tr><td>${s[0]}</td><td class="mono">${s[1]}</td><td class="mono link">${s[3]}</td><td>${s[4]}</td><td>${8-i}/9</td><td><div class="progress"><i style="width:${92-i*8}%"></i></div></td><td>${status(i<2?'已完成':i<5?'进行中':'准备中')}</td></tr>`).join('')}</tbody></table></div><div class="side-card"><div class="section-line"><h2>功能线完成情况</h2></div>${[['RA',24,24],['Clinical',21,24],['Data Management',19,24],['Statistics',18,24],['Medical Writing',16,21],['PV',14,21]].map(x=>`<div class="line-item"><span>${x[0]}</span><span class="mono">${x[1]} / ${x[2]}</span></div>`).join('')}</div></div>`}
function risk(){const rows=[['RSK-2026-018','HDM1005-302','RA','IND补充资料反馈延迟','张伟',80,'高风险','Open'],['RSK-2026-017','HDM2015-102','Clinical','首家中心启动晚于计划','李静',48,'中风险','Mitigating'],['RSK-2026-014','HDM2020-001','Data','数据清理规则待确认','王芳',30,'中风险','Open'],['RSK-2026-011','HDM3022-201','PV','SAE随访信息不完整','刘洋',18,'低风险','Monitoring']];return `<div class="toolbar"><div class="control wide">搜索 Risk ID / 描述 / Owner</div><div class="control">全部状态 <span>⌄</span></div><div class="control">全部等级 <span>⌄</span></div><div class="spacer"></div><button class="btn primary">＋ 新增风险</button></div><div class="stats"><div class="stat"><div class="label">开放风险</div><div class="value">7</div></div><div class="stat"><div class="label">高风险</div><div class="value">2</div><div class="note">需要立即处理</div></div><div class="stat"><div class="label">有额外措施</div><div class="value">3</div></div><div class="stat"><div class="label">本月已关闭</div><div class="value">4</div></div></div><div class="panel"><div class="panel-head"><h2>Risk Register</h2><small>风险分数 = 影响 × 可能性 × 可检测性</small></div><table><thead><tr><th>Risk ID</th><th>Study No.</th><th>功能线</th><th style="width:250px">风险描述</th><th>Owner</th><th>风险分数</th><th>等级</th><th>额外措施</th><th>Status</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td class="mono link">${r[0]}</td><td class="mono">${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td><td class="risk-score">${r[5]}</td><td><span class="chip ${i===0?'red':i<3?'orange':'green'}">${r[6]}</span></td><td>${i<3?'<span class="chip blue">有 · '+(i+1)+' 条</span>':'—'}</td><td>${status(r[7]==='Open'?'进行中':r[7]==='Monitoring'?'准备中':'已完成')}</td></tr>`).join('')}</tbody></table></div>`}
function team(){const roles=['PL','PM','RA Manager','Clinical Lead','Data Manager','Statistician','PV Lead'];return `<div class="toolbar"><div class="control wide">搜索 Study</div><div class="control wide">搜索角色 / 成员</div><div class="spacer"></div><span class="hint">6 个 Study · 47 个角色</span><button class="btn primary">编辑矩阵</button></div><div class="panel"><div class="panel-head"><h2>团队成员矩阵</h2><small>PL / PM 可维护所属项目，管理员可维护全部</small></div><table class="matrix"><thead><tr><th>角色 / Study</th>${studies.map(s=>`<th><span class="mono">${s[3]}</span><br><span class="muted">${s[4]}</span></th>`).join('')}</tr></thead><tbody>${roles.map((r,ri)=>`<tr><td class="strong">${r}<br><span class="muted">${ri<2?'项目管理':'功能线'}</span></td>${studies.map((s,si)=>`<td><span class="person">${[['张伟','李静','王芳','刘洋','赵敏','周强'][(ri+si)%6]]}</span></td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function config(){return `<div class="toolbar"><div class="control wide">搜索 Program / Project / Study</div><div class="control">全部 TA <span>⌄</span></div><div class="control">全部 Phase Status <span>⌄</span></div><div class="spacer"></div><button class="btn primary">＋ 新增配置</button></div><div class="panel"><div class="panel-head"><h2>管线基础配置</h2><small>Program / Project / Study 单一数据源 · Project状态实时计算</small><div class="right">共 24 条</div></div><table><thead><tr><th>Source</th><th>Origin</th><th>Product</th><th>MOA</th><th>Program</th><th>Indication</th><th>Project</th><th>TA</th><th>Study No.</th><th>Phase Status</th></tr></thead><tbody>${studies.map((s,i)=>`<tr><td>${['自研','引进','合作'][i%3]}</td><td>${i%2?'进口':'国产'}</td><td>HDM-${100+i}</td><td>${['JAK1','PD-1','GLP-1','HER2','BTK','FGF21'][i]}</td><td class="mono">${s[1]}</td><td>${s[4]}</td><td>${s[2]}</td><td>${s[0]}</td><td class="mono link">${s[3]}</td><td><span class="chip blue">${s[5]}</span></td></tr>`).join('')}</tbody></table></div>`}
function report(){return `<div class="report-layout"><div class="report-controls"><h2 style="font-size:14px;margin:0 0 18px">生成月度报告</h2><div class="field"><label>报告月份</label><div class="control">2026-07 <span>⌄</span></div></div><div class="field"><label>治疗领域</label><div class="control">全部 TA <span>⌄</span></div></div><div class="field"><label>Program</label><div class="control">全部 Program <span>⌄</span></div></div><div class="field"><label>报告内容</label><div class="permission"><span class="chip blue">管线进展</span><span class="chip blue">月度汇报</span><span class="chip blue">风险清单</span><span class="chip gray">团队矩阵</span></div></div><button class="btn primary" style="width:100%;margin-top:8px">生成预览</button><button class="btn" style="width:100%;margin-top:8px">导出 Excel</button><button class="btn" style="width:100%;margin-top:8px">打印 / PDF</button><div class="hint" style="margin-top:18px;line-height:1.7">查询口径：按月份读取月度汇报，并关联同一数据范围内的 Study、开放风险与里程碑。</div></div><div class="report-preview"><div style="display:flex;align-items:start"><div><h1>临床研发管线月度报告</h1><div class="muted">2026年7月 · 全部治疗领域</div></div><div class="spacer"></div><span class="chip blue">自动生成</span></div><div class="stats" style="margin-top:18px"><div class="stat"><div class="label">项目数</div><div class="value">18</div></div><div class="stat"><div class="label">Study</div><div class="value">24</div></div><div class="stat"><div class="label">月报完成率</div><div class="value">81%</div></div><div class="stat"><div class="label">开放风险</div><div class="value">7</div></div></div><h3>本月重点进展</h3><table><thead><tr><th>Study</th><th>功能线</th><th style="width:55%">月度进展</th><th>状态</th></tr></thead><tbody><tr><td class="mono">HDM1005-302</td><td>Clinical</td><td>完成主要研究者会议，首批中心进入启动准备。</td><td>${status('进行中')}</td></tr><tr><td class="mono">HDM2015-102</td><td>RA</td><td>IND补充资料完成内部审核并提交。</td><td>${status('已完成')}</td></tr><tr><td class="mono">HDM2020-001</td><td>Data</td><td>EDC建库完成，进入用户验收测试。</td><td>${status('进行中')}</td></tr></tbody></tab
