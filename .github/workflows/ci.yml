name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Frontend build and validation
        run: npm --prefix frontend run check
      - name: Unit and integration tests
        run: mvn -B -ntp verify
      - name: Backend module boundary tests
        run: node --test tests/backend-module-boundaries.test.js
      - name: Legacy prototype regression tests
        run: node --test "管线总览 Coverpage.test.js"
