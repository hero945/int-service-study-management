name: CI
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Frontend build and validation
        run: npm --prefix frontend run check
      - name: Unit and integration tests
        run: mvn -B -ntp verify
      - name: Backend module boundary tests
        run: node --test tests/backend-module-boundaries.test.js
      - name: Legacy prototype regression tests
        run: node --test "管线总览 Coverpage.test.js"
  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release.yml
